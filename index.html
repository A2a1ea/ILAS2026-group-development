<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertical Bullet Garden</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="game-shell" aria-label="Vertical Bullet Garden browser game">
    <section class="hud" aria-label="Game status">
      <div>
        <span class="label">Score</span>
        <strong id="score">0</strong>
      </div>
      <div>
        <span class="label">HP</span>
        <strong id="hp">5</strong>
      </div>
      <div>
        <span class="label">Phase</span>
        <strong id="time">45</strong>
      </div>
      <div>
        <span class="label">Flow</span>
        <strong id="best">0</strong>
      </div>
    </section>

    <section class="upgrade-summary" aria-label="Upgrade summary">
      <span class="label">Upgrades</span>
      <ol id="upgradeSummary">
        <li>No upgrades yet</li>
      </ol>
    </section>

    <section class="stage-wrap">
      <canvas id="game" width="540" height="800" tabindex="0" aria-label="Vertical Bullet Garden play field"></canvas>
      <div class="buff-tray" id="buffTray" aria-live="polite" hidden></div>
      <div class="overlay" id="overlay">
        <h1>Vertical Bullet Garden</h1>
        <p>ひらがなを集めてことばを作り、強化を重ねてボス戦へ進みます。</p>
        <div class="menu-actions" aria-label="Mode selection">
          <button id="startButton" type="button">Start</button>
          <label class="key-config">
            <span>操作</span>
            <select id="keyPreset" aria-label="キー設定">
              <option value="standard">WASD / J / K</option>
              <option value="touhou">東方式 / 矢印 / Z / X</option>
            </select>
          </label>
        </div>
        <p class="hint" id="controlHint">WASDで移動、Shiftで低速、Jでショット、Kで文字弾、Spaceで属性切り替え。</p>
      </div>
    </section>

    <section class="status-panel" aria-label="Letters, effects, and rankings">
      <div>
        <span class="label">Letters</span>
        <strong id="letterRack">collect letters</strong>
      </div>
      <div>
        <span class="label">Effects</span>
        <strong id="effects">no active effects</strong>
      </div>
      <div class="ranking">
        <span class="label">Online Ranking</span>
        <ol id="rankingList">
          <li>No runs yet</li>
        </ol>
      </div>
    </section>
    <section class="debug-panel" id="debugPanel" aria-label="Debug controls" hidden>
      <label>
        <input id="debugInvincible" type="checkbox">
        Invincible
      </label>
      <label>
        Letters
        <input id="debugLetters" type="text" maxlength="8" placeholder="ほのお">
      </label>
      <button id="debugGrantLetters" type="button">Add</button>
      <button id="debugSkipPhase" type="button">Skip</button>
      <label>
        Boss
        <select id="debugBossSelect"></select>
      </label>
      <button id="debugStartBoss" type="button">Boss</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
